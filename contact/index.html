  <style>
    .contact-form {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-control {
      width: 100%;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: var(--font-sans);
      padding: 12px 14px;
      font-size: 14px;
      border-radius: var(--radius-control);
    }

    .form-control:focus {
      outline: none;
      border-color: var(--primary);
      background: var(--surface-3);
    }

    .contact-status {
      display: none;
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: var(--radius-control);
      font-weight: 600;
      text-align: center;
      border: 1px solid transparent;
      transition: opacity 0.2s ease, border-color 0.2s ease, color 0.2s ease, background 0.2s ease;
    }

    .contact-status.is-success {
      display: block;
      color: var(--success);
      background: rgba(16, 185, 129, 0.08);
      border-color: rgba(16, 185, 129, 0.18);
    }

    .contact-status.is-warning {
      display: block;
      color: #d97706;
      background: rgba(245, 158, 11, 0.08);
      border-color: rgba(245, 158, 11, 0.18);
    }

    .contact-status.is-error {
      display: block;
      color: var(--error);
      background: rgba(239, 68, 68, 0.08);
      border-color: rgba(239, 68, 68, 0.18);
    }

    .contact-status.is-loading {
      display: block;
      color: var(--text-2);
      background: var(--surface-2);
      border-color: var(--border);
    }

    #btnSubmitContact:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      filter: saturate(0.8);
    }
  </style>

  <!-- Top Ad Slot Placeholder -->
  <div class="container" style="margin-top: 80px;">
  </div>

  <main class="section">
    <div class="container" style="max-width: 700px;">
      <div class="section-header">
        <h1 class="section-title">Contact Us</h1>
        <div class="section-divider"></div>
        <p class="section-sub">Have questions, feedback, or security reports? Send us a message.</p>
      </div>

      <div class="feature-card" style="padding: 36px;">
        <form class="contact-form" id="contactForm">
          <div class="form-group">
            <label class="field-label">Your Name</label>
            <input type="text" class="form-control" id="contactName" placeholder="John Doe" maxlength="120" required>
          </div>

          <div class="form-group">
            <label class="field-label">Your Email</label>
            <input type="email" class="form-control" id="contactEmail" placeholder="john@example.com" required>
          </div>

          <div class="form-group">
            <label class="field-label">Message</label>
            <textarea class="form-control" id="contactMessage" style="height: 120px;" maxlength="5000"
              placeholder="Type your message here..." required></textarea>
          </div>

          <div class="cf-turnstile" data-sitekey="0x4AAAAAAE695HIPb-6T9Vs6" data-theme="auto"
            data-callback="onContactTurnstileSuccess" data-expired-callback="onContactTurnstileExpired"
            data-error-callback="onContactTurnstileError"></div>
          <button class="btn-primary" type="submit" id="btnSubmitContact">
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="m22 2-7 20-4-9-9-4Z" />
              <path d="M22 2 11 13" />
            </svg>
            <span>Send Message</span>
          </button>

        <div id="contactStatus" class="contact-status" role="status" aria-live="polite"></div>

  </div>

    </div>

  <script src="/js/translations.js"></script>
  <script src="/js/common.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const CONTACT_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzUtmqFybVmsx7sFXTr6NrOseus0H9ZFTMb3TCEag4BeLmKOa17ioytYCayiy80fCTqNg/exec';
      const contactForm = document.getElementById('contactForm');
      const contactStatus = document.getElementById('contactStatus');
      const submitButton = document.getElementById('btnSubmitContact');
      const submitButtonLabel = submitButton.querySelector('span');

      let turnstileToken = '';
      let statusTimer = null;
      let isSubmitting = false;

      function setStatus(message, tone = 'success') {
        contactStatus.textContent = message;
        contactStatus.className = `contact-status is-${tone}`;
        contactStatus.setAttribute('aria-live', 'polite');

        if (statusTimer) {
          window.clearTimeout(statusTimer);
        }

        if (tone === 'success') {
          statusTimer = window.setTimeout(() => {
            clearStatus();
          }, 4000);
        }
      }

      function clearStatus() {
        if (statusTimer) {
          window.clearTimeout(statusTimer);
          statusTimer = null;
        }
        contactStatus.textContent = '';
        contactStatus.className = 'contact-status';
      }

      function updateNetworkState() {
        const isOffline = !navigator.onLine;
        submitButton.disabled = isOffline || isSubmitting;
        submitButton.setAttribute('aria-disabled', String(submitButton.disabled));

        if (isOffline) {
          setStatus('You are offline. Please reconnect to the internet before sending your message.', 'warning');
        } else if (contactStatus.classList.contains('is-warning') &&
          contactStatus.textContent.startsWith('You are offline.')) {
          clearStatus();
        }
      }

      window.onContactTurnstileSuccess = token => {
        turnstileToken = token;
        if (contactStatus.classList.contains('is-error') &&
          contactStatus.textContent.includes('security check')) {
          clearStatus();
        }
      };

      window.onContactTurnstileExpired = () => {
        turnstileToken = '';
      };

      window.onContactTurnstileError = () => {
        turnstileToken = '';
        setStatus('The security check could not load. Check your connection and try again.', 'error');
      };

      contactForm.addEventListener('submit', (event) => {
        event.preventDefault();

        if (!navigator.onLine) {
          updateNetworkState();
          return;
        }

        if (!contactForm.reportValidity()) return;

        if (!CONTACT_ENDPOINT) {
          setStatus('The contact service is not connected yet. Your message has not been sent.', 'warning');
          return;
        }

        if (!turnstileToken) {
          setStatus('Please complete the security check before sending.', 'error');
          return;
        }

        submitContactMessage();
      });

      async function submitContactMessage() {
        isSubmitting = true;
        updateNetworkState();
        clearStatus();
        const originalButtonText = submitButtonLabel.textContent;
        submitButtonLabel.textContent = 'Sending…';
        const controller = new AbortController();
        const timeoutId = window.setTimeout(() => controller.abort(), 20000);

        try {
          const response = await fetch(CONTACT_ENDPOINT, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
            body: JSON.stringify({
              name: document.getElementById('contactName').value.trim(),
              email: document.getElementById('contactEmail').value.trim(),
              message: document.getElementById('contactMessage').value.trim(),
              turnstileToken
            }),
            signal: controller.signal
          });

          const responseText = await response.text();
          let result;
          try {
            result = JSON.parse(responseText);
          } catch {
            throw new Error('The contact service returned an unreadable response. Please try again later.');
          }

          if (!response.ok || !result || result.success !== true) {
            throw new Error(result && result.message
              ? result.message
              : 'The message could not be sent. Please try again.');
          }

          setStatus(result.message || 'Your message was sent successfully.', 'success');
          contactForm.reset();
          turnstileToken = '';
          if (window.turnstile) window.turnstile.reset();
        } catch (error) {
          const message = error.name === 'AbortError'
            ? 'The request timed out. Check your connection and try again.'
            : error instanceof TypeError
              ? 'Could not reach the contact service. Check your connection and endpoint configuration, then try again.'
              : error.message;
          setStatus(message, 'error');
        } finally {
          window.clearTimeout(timeoutId);
          turnstileToken = '';
          if (window.turnstile) window.turnstile.reset();
          isSubmitting = false;
          submitButtonLabel.textContent = originalButtonText;
          updateNetworkState();
        }
      }

      window.addEventListener('online', updateNetworkState);
      window.addEventListener('offline', updateNetworkState);
      updateNetworkState();
    });
  </script>
</body>

</html>
